<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BrainUp</title>

<link rel="stylesheet" href="style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>


<div class="app">


<!-- ================= КЕЙСЫ ================= -->


<div class="cases-page">


<div class="top">

<div class="logo">
🧠 BrainUp
</div>


<div class="coins">
🪙 500
</div>

</div>



<h1>
🎁 Кейсы
</h1>



<div class="cases">



<div class="case" onclick="openCasePage('Lucky Case','images/cases/lucky.png',49)">

<img src="images/cases/lucky.png">

<h3>Lucky Case</h3>

<div class="price">
🪙49
</div>

</div>




<div class="case" onclick="openCasePage('Crazy Case','images/cases/crazy.png',79)">

<img src="images/cases/crazy.png">

<h3>Crazy Case</h3>

<div class="price">
🪙79
</div>

</div>





<div class="case" onclick="openCasePage('Mystery Case','images/cases/mystery.png',99)">

<img src="images/cases/mystery.png">

<h3>Mystery Case</h3>

<div class="price">
🪙99
</div>

</div>





<div class="case" onclick="openCasePage('Rich Case','images/cases/rich.png',149)">

<img src="images/cases/rich.png">

<h3>Rich Case</h3>

<div class="price">
🪙149
</div>

</div>





<div class="case" onclick="openCasePage('Legend Case','images/cases/legend.png',249)">

<img src="images/cases/legend.png">

<h3>Legend Case</h3>

<div class="price">
🪙249
</div>

</div>





<div class="case" onclick="openCasePage('Guest Case','images/cases/guest.png',666)">

<img src="images/cases/guest.png">

<h3>Guest Case</h3>

<div class="price">
🪙666
</div>

</div>





<div class="case" onclick="openCasePage('God Case','images/cases/god.png',1000)">

<img src="images/cases/god.png">

<h3>God Case</h3>

<div class="price">
🪙1000
</div>

</div>



</div>


</div>








<!-- ================= ОТКРЫТИЕ КЕЙСА ================= -->


<div class="open-page">


<button class="back-btn" onclick="goCases()">

← Вернуться к кейсам

</button>



<h1 class="case-title"></h1>



<img class="open-image">



<div class="open-price"></div>




<button class="open-button" onclick="openReward()">

🎁 Открыть кейс

</button>



<div class="result">

</div>


</div>









<!-- ================= АПГРЕЙДЕР ================= -->


<div class="upgrade-page">


<div class="top">

<div class="logo">
🧠 BrainUp
</div>


<div class="coins">
🪙500
</div>

</div>



<h1>
⚡ Апгрейдер
</h1>


<div class="empty-page">

Скоро здесь будет апгрейдер 🚀

</div>


</div>









<!-- ================= ПРОФИЛЬ ================= -->


<div class="profile-page">


<div class="top">

<div class="logo">
🧠 BrainUp
</div>


<div class="coins">
🪙500
</div>

</div>



<h1>
👤 Профиль
</h1>


<div class="empty-page">

Скоро здесь будет профиль 👤

</div>


</div>








<!-- ================= НИЖНЕЕ МЕНЮ ================= -->


<div class="bottom-menu">


<div class="menu active" onclick="goCases()">

🎁

<span>
Кейсы
</span>

</div>



<div class="menu" onclick="goUpgrade()">

⚡

<span>
Апгрейдер
</span>

</div>




<div class="menu" onclick="goProfile()">

👤

<span>
Профиль
</span>

</div>



</div>





</div>






<script>


Telegram.WebApp.expand();



function hideAll(){


document.querySelector(".cases-page").style.display="none";

document.querySelector(".open-page").style.display="none";

document.querySelector(".upgrade-page").style.display="none";

document.querySelector(".profile-page").style.display="none";


}



function goCases(){

hideAll();

document.querySelector(".cases-page").style.display="block";

}



function goUpgrade(){

hideAll();

document.querySelector(".upgrade-page").style.display="block";

}



function goProfile(){

hideAll();

document.querySelector(".profile-page").style.display="block";

}




function openCasePage(name,image,price){


hideAll();


document.querySelector(".open-page").style.display="block";


document.querySelector(".case-title").innerText=name;


document.querySelector(".open-image").src=image;


document.querySelector(".open-price").innerHTML=

"🪙 Цена открытия: "+price;


}




function openReward(){


let items=[

"🪙100 монет",

"💎Редкий предмет",

"🔥Легендарный скин",

"⚡Бустер",

"🎁Новый кейс"

];


let result =
items[Math.floor(Math.random()*items.length)];



document.querySelector(".result").innerHTML=

`
<h2>🎉 Выпало:</h2>
<h2>${result}</h2>
`;



}



</script>



</body>

</html>
